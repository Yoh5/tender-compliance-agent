<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img"
     aria-label="Architecture: the model proposes on the upper band, deterministic code decides on the lower band, every agent is given the same checks as Strands tools, and every path from left to right passes through the lower band.">
  <title>Tender Compliance Agent — architecture</title>
  <desc>A consultation PDF is read by extraction.py. Twice, a Strands agent proposes
  something — obligations, then matching evidence — and each proposal is checked by
  deterministic code before it may continue. Dates and thresholds are arithmetic. The
  matrix validates itself and refuses to print a claim it cannot show. Each agent also
  receives those same checks as Strands tools, so it can correct a citation before committing
  to it; the verification below runs either way, whether the tool was called or ignored.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6880"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8243b"/>
    </marker>
  </defs>

  <rect width="1180" height="560" fill="#f6f8fb"/>

  <text x="40" y="46" font-size="21" font-weight="600" fill="#14203a">Tender Compliance Agent</text>
  <text x="40" y="68" font-size="13.5" fill="#5b6880">The model observes. The code decides. Nothing reaches the matrix without being checked against the document.</text>

  <!-- ============ band: model ============ -->
  <rect x="40" y="100" width="1100" height="128" rx="4" fill="#eef2f8" stroke="#ccd6e4"/>
  <text x="56" y="122" font-size="10.5" letter-spacing="1.6" fill="#5b6880">THE MODEL PROPOSES — STRANDS AGENTS SDK</text>

  <g fill="#ffffff" stroke="#8a97ad" stroke-width="1.2">
    <rect x="340" y="132" width="210" height="56" rx="4"/>
    <rect x="700" y="132" width="210" height="56" rx="4"/>
  </g>
  <g font-size="12.5" fill="#14203a" text-anchor="middle">
    <text x="445" y="155">proposes obligations</text>
    <text x="805" y="155">proposes matching evidence</text>
  </g>
  <g font-size="10.5" fill="#5b6880" text-anchor="middle">
    <text x="445" y="173">quote + page, 4 pages per call</text>
    <text x="805" y="173">document name, 5 requirements per call</text>
  </g>

  <!-- the same checks, handed to the agent as @tool so it can correct itself first -->
  <g fill="#f6f8fb" stroke="#8a97ad" stroke-width="1.2" stroke-dasharray="4 3">
    <rect x="340" y="188" width="210" height="32" rx="4"/>
    <rect x="700" y="188" width="210" height="32" rx="4"/>
  </g>
  <g font-size="10" fill="#5b6880" text-anchor="middle">
    <text x="445" y="202">@tool  page_text</text>
    <text x="445" y="214">@tool  quote_is_on_page</text>
    <text x="805" y="202">@tool  list_documents</text>
    <text x="805" y="214">@tool  document_is_in_library</text>
  </g>

  <!-- ============ band: code ============ -->
  <rect x="40" y="264" width="1100" height="116" rx="4" fill="#e7ecf4" stroke="#ccd6e4"/>
  <text x="56" y="286" font-size="10.5" letter-spacing="1.6" fill="#5b6880">THE CODE DECIDES — NO MODEL, NO NETWORK, NO KEY</text>

  <g fill="#ffffff" stroke="#14203a" stroke-width="1.4">
    <rect x="60" y="298" width="200" height="64" rx="4"/>
    <rect x="340" y="298" width="210" height="64" rx="4"/>
    <rect x="700" y="298" width="210" height="64" rx="4"/>
    <rect x="960" y="298" width="180" height="64" rx="4"/>
  </g>
  <g font-size="12.5" font-weight="600" fill="#14203a" text-anchor="middle">
    <text x="160" y="322">extraction.py</text>
    <text x="445" y="322">obligations.verify</text>
    <text x="805" y="322">evidence.resolve</text>
    <text x="1050" y="322">validity · capacity</text>
  </g>
  <g font-size="10.5" fill="#5b6880" text-anchor="middle">
    <text x="160" y="340">pages, and what it</text>
    <text x="160" y="353">could not read</text>
    <text x="445" y="340">is the quote on that</text>
    <text x="445" y="353">page? word pairs ≥ 0.6</text>
    <text x="805" y="340">is that document in</text>
    <text x="805" y="353">the library? verbatim</text>
    <text x="1050" y="340">dates and thresholds,</text>
    <text x="1050" y="353">by arithmetic</text>
  </g>

  <!-- ============ inputs / outputs ============ -->
  <g fill="#ffffff" stroke="#5b6880" stroke-width="1.2" stroke-dasharray="4 3">
    <rect x="60" y="430" width="200" height="52" rx="4"/>
    <rect x="700" y="430" width="210" height="52" rx="4"/>
  </g>
  <g font-size="12" fill="#14203a" text-anchor="middle">
    <text x="160" y="452">consultation file (PDF)</text>
    <text x="805" y="452">evidence library + profile</text>
  </g>
  <g font-size="10.5" fill="#5b6880" text-anchor="middle">
    <text x="160" y="469">written by the buyer — untrusted</text>
    <text x="805" y="469">what the company holds and earns</text>
  </g>

  <rect x="960" y="424" width="180" height="64" rx="4" fill="#14203a"/>
  <text x="1050" y="448" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">compliance matrix</text>
  <text x="1050" y="466" font-size="10.5" fill="#c9d6e8" text-anchor="middle">self-checked, then</text>
  <text x="1050" y="479" font-size="10.5" fill="#c9d6e8" text-anchor="middle">report.html</text>

  <!-- ============ flow ============ -->
  <g stroke="#5b6880" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M160 430 L160 366"/>
    <path d="M260 316 L330 316 L330 174 L336 174"/>
    <path d="M445 220 L445 294"/>
    <path d="M550 316 L620 316 L620 174 L696 174"/>
    <path d="M805 220 L805 294"/>
    <path d="M805 430 L805 384 L690 384 L690 340 L696 340"/>
    <path d="M910 330 L956 330"/>
    <path d="M1050 366 L1050 420"/>
  </g>

  <!-- the refusals: what does not go through -->
  <g stroke="#a8243b" stroke-width="1.6" fill="none" marker-end="url(#ar)" stroke-dasharray="5 4">
    <path d="M400 362 L400 404 L520 404"/>
    <path d="M760 362 L760 404 L880 404"/>
  </g>
  <g font-size="10.5" fill="#a8243b">
    <text x="526" y="408">quote not on the page → rejected, with a reason</text>
    <text x="886" y="408">document not held → not a match</text>
  </g>

  <text x="40" y="524" font-size="11" fill="#5b6880">
    A page whose text is stored as images, or that carries an instruction aimed at the model, costs the whole file its standing — the report says so rather than carrying on.
  </text>
  <text x="40" y="542" font-size="11" fill="#5b6880">
    coverage.check refuses to print a row marked covered that cites no evidence: the tool asserting what it cannot show is the one failure it will not commit.
  </text>
</svg>
